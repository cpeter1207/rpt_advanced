# Include once in nginx's http context for either controller site.
map $http_upgrade $rpt_upgrade {
    default "";
    ~*^websocket$ websocket;
}
map $rpt_upgrade $rpt_connection {
    default upgrade;
    "" "";
}

# Same-origin GET/HEAD may omit Origin. WebSockets and writes must send it.
map "$request_method:$rpt_upgrade:$http_origin" $rpt_checked_origin {
    default $http_origin;
    "GET::" $rpt_browser_origin;
    "HEAD::" $rpt_browser_origin;
}

map "$request_method:$http_content_type" $rpt_api_rejection {
    default method;
    "POST:application/hal+json" "";
    "PUT:application/hal+json" "";
    "PATCH:application/json-patch+json" "";
    "DELETE:" "";
    ~^(GET|HEAD): "";
    ~^(POST|PUT|PATCH|DELETE): media;
}

# A host-only cookie prevents sibling origins from supplying a chosen token.
map $http_cookie $rpt_csrf_cookie {
    default "";
    "~(?:^|;\s*)__Host-rpt-csrf=(?<rpt_csrf_value>[0-9a-f]{32})(?:;|$)" $rpt_csrf_value;
}
map "$request_method:$rpt_csrf_cookie:$http_x_csrf_token" $rpt_csrf_ok {
    default 0;
    ~^(GET|HEAD): 1;
    "~^[^:]+:([0-9a-f]{32}):\1$" 1;
}
map "$request_method:$uri:$rpt_csrf_cookie" $rpt_csrf_set_cookie {
    default "";
    "GET:/api/v1:" "__Host-rpt-csrf=$request_id; Path=/; Secure; SameSite=Strict";
    "GET:/api/v1/:" "__Host-rpt-csrf=$request_id; Path=/; Secure; SameSite=Strict";
}
