# Copy to an administrator-managed nginx site. Include controller-http.conf in http.
# Bind to the private interface reachable by the separately hosted console.
# The ingress certificate verifies the private DNS name; HTTP Host is the browser authority.
server {
    listen 127.0.0.1:8444 ssl;
    server_name controller-ingress.example.invalid console.example.invalid;
    ssl_certificate /etc/rpt-advanced/nginx/frontend.pem;
    ssl_certificate_key /etc/rpt-advanced/nginx/frontend.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;

    ssl_client_certificate /etc/rpt-advanced/nginx/forwarder-ca.pem;
    ssl_verify_client on;
    # Replace with the lowercase, colon-free nginx $ssl_client_fingerprint value
    # of the authorized edge certificate (openssl x509 -noout -fingerprint -sha1).
    if ($ssl_client_fingerprint != "0000000000000000000000000000000000000000") { return 403; }

    set $rpt_browser_host console.example.invalid;
    set $rpt_browser_origin https://console.example.invalid;
    set $rpt_oidc_issuer https://identity.example.invalid/realms/radio;
    include /usr/share/rpt-advanced/nginx/controller-server.conf;

    location / { return 404; }
}
