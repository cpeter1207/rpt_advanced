# Shared sites pin the external browser authority, including any non-default port.
# Provision the controller with that browser origin in "origins", localhost:8443
# in "authorities", and the management client leaf as a "browser_principal_proxy".
# For a different backend authority or TLS server name, copy this include to
# administrator-managed configuration and update its backend directives.
if ($http_host != $rpt_browser_host) { return 421; }
access_log off;
error_log /dev/null crit;
ssl_early_data off;

# Authenticator is a local, separately configured OAuth2 Proxy. No request body
# or client-supplied identity is sent to the subrequest.
location = /oauth2/auth {
    internal;
    auth_request off;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $rpt_browser_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Host $rpt_browser_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_pass http://127.0.0.1:4180;
}

location ~ ^/oauth2/(?:start|callback|sign_out)$ {
    if ($request_method != GET) { return 405; }
    auth_request off;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $rpt_browser_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Host $rpt_browser_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_pass http://127.0.0.1:4180;
}

location ~ ^/api/v1(?:/|$) {
    if ($rpt_api_rejection = method) { return 405; }
    if ($rpt_api_rejection = media) { return 415; }
    if ($rpt_checked_origin != $rpt_browser_origin) { return 403; }
    if ($rpt_csrf_ok = 0) { return 403; }

    satisfy all;
    auth_request /oauth2/auth;
    auth_request_set $rpt_browser_subject $upstream_http_x_auth_request_user;

    # Limit traffic to the transport's 1 MiB bound and stream sensitive payloads.
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_in_file_only off;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_redirect off;

    # Allow only headers that the HAL or WebSocket transport consumes.
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost:8443;
    proxy_set_header Origin $rpt_browser_origin;
    proxy_set_header Accept $http_accept;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header If-Match $http_if_match;
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_set_header Connection $rpt_connection;
    proxy_set_header Upgrade $rpt_upgrade;
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
    proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header X-Rpt-Advanced-Oidc-Issuer $rpt_oidc_issuer;
    proxy_set_header X-Rpt-Advanced-Oidc-Subject $rpt_browser_subject;

    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Cache-Control "no-store" always;
    add_header Set-Cookie $rpt_csrf_set_cookie;

    proxy_ssl_certificate /etc/rpt-advanced/nginx/management-client.pem;
    proxy_ssl_certificate_key /etc/rpt-advanced/nginx/management-client.key;
    proxy_ssl_trusted_certificate /etc/rpt-advanced/nginx/management-ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_pass https://127.0.0.1:8443;
}
