# Copy to an administrator-managed nginx site. Include controller-http.conf in http.
# Replace the browser authority, TLS paths and OIDC issuer for this site.
server {
    listen 127.0.0.1:443 ssl;
    server_name console.example.invalid;
    ssl_certificate /etc/rpt-advanced/nginx/frontend.pem;
    ssl_certificate_key /etc/rpt-advanced/nginx/frontend.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    set $rpt_browser_host console.example.invalid;
    set $rpt_browser_origin https://console.example.invalid;
    set $rpt_oidc_issuer https://identity.example.invalid/realms/radio;
    include /usr/share/rpt-advanced/nginx/controller-server.conf;

    # With rpt-advanced-console installed, use its include for the static app.
    # include /usr/share/rpt-advanced-console/nginx/console-static.conf;
    # Remove this location when including the static app.
    location / { return 404; }
}
