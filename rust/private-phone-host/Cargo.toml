[package]
name = "rptadv-private-phone-host"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rptadv-codec-client = { git = "https://github.com/cpeter1207/rptadv-codec-adapters", rev = "8596809c3ff8493d705bc2f65371e9f0b6e4fef2" }
rptadv-jitter-client = { path = "../jitter-client" }
uuid = { version = "1", default-features = false }
zeroize = "1.9.0"
libc = "0.2"
libloading = "0.8"
rtp = "=0.13.0"
sdp = "=0.8.0"
tokio = { version = "=1.54.1", features = ["net", "rt", "time", "sync", "macros"] }
webrtc-util = { version = "=0.11.0", default-features = false, features = ["marshal"] }

[build-dependencies]
bindgen = "0.72.1"
