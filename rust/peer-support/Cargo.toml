[package]
name = "rptadv-peer-support"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
libc = "0.2"
libloading = "0.8"

[dev-dependencies]
rptadv-control-standalone-adapter = { path = "../control-standalone-adapter" }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
ring = "0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false }
rptadv-json = { path = "../json" }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "=0.24.1", default-features = false, features = ["openssl"] }
turn-client-proto = "=0.8.0"
turn-client-rustls = "=0.2.0"
uuid = { version = "1", default-features = false }
zeroize = "1.9.0"
