# Ephemeral test-only frontend with a per-fixture CSRF value and real Basic authentication.
ServerRoot "@DIR@"
DefaultRuntimeDir "@DIR@"
PidFile "@DIR@/apache.pid"
ServerName localhost
Listen 127.0.0.1:@FRONT@
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule env_module /usr/lib/apache2/modules/mod_env.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authn_file_module /usr/lib/apache2/modules/mod_authn_file.so
LoadModule auth_basic_module /usr/lib/apache2/modules/mod_auth_basic.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
User nobody
Group nogroup
ServerLimit 1
StartServers 1
ThreadsPerChild 4
MinSpareThreads 1
MaxSpareThreads 4
MaxRequestWorkers 4
ErrorLog "@DIR@/error.log"
LogLevel crit
<VirtualHost 127.0.0.1:@FRONT@>
    SSLEngine on
    SSLCertificateFile "@PKI@/server.pem"
    SSLCertificateKeyFile "@PKI@/server.key"
    SSLProxyEngine on
    SSLProxyVerify require
    SSLProxyCheckPeerName on
    SSLProxyCheckPeerExpire on
    SSLProxyCACertificateFile "@PKI@/@CA@.pem"
    SSLProxyMachineCertificateFile "@PKI@/apache-pair.pem"
    ProxyRequests Off
    # Verify the configured backend name and send its matching HTTP authority.
    ProxyPreserveHost Off
    RequestHeader unset Authorization
    RequestHeader unset X-CSRF-Token
    RequestHeader unset X-Forwarded-Client-Cert
    # Use the authenticated Basic user as a fixture subject. Never pass the browser's headers.
    RequestHeader unset X-Rpt-Advanced-Oidc-Issuer
    RequestHeader unset X-Rpt-Advanced-Oidc-Subject
    RequestHeader set X-Rpt-Advanced-Oidc-Issuer "https://fixture.local/realms/test" "expr=%{REQUEST_URI} == '/frontend-principal'"
    RequestHeader set X-Rpt-Advanced-Oidc-Subject "expr=%{REMOTE_USER}" "expr=%{REQUEST_URI} == '/frontend-principal'"
    RequestHeader unset X-HTTP-Method-Override
    SetEnv proxy-sendchunked 1
    LimitRequestBody 1048576
    ProxyPass "/api/v1/status/stream/" "https://@NAME@:@BACK@/api/v1/status/stream/" upgrade=websocket keepalive=On connectiontimeout=2 timeout=40
    ProxyPass "/" "https://@NAME@:@BACK@/" keepalive=On connectiontimeout=2 timeout=4
    <Location "/">
        AuthType Basic
        AuthName "test console"
        AuthBasicProvider file
        AuthUserFile "@DIR@/users"
        <RequireAll>
            Require valid-user
            Require expr "%{REQUEST_METHOD} in {'GET', 'HEAD', 'OPTIONS'} || (req('Origin') == 'https://console.local' && req('X-CSRF-Token') == '@CSRF@' && ((%{REQUEST_METHOD} == 'PATCH' && req('Content-Type') == 'application/json-patch+json') || (%{REQUEST_METHOD} in {'PUT', 'POST'} && req('Content-Type') == 'application/hal+json') || %{REQUEST_METHOD} == 'DELETE'))"
        </RequireAll>
    </Location>
</VirtualHost>
