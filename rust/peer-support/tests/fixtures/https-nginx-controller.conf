# Isolated nginx loads the shipped configuration and a loopback OIDC session stand-in.
daemon off;
worker_processes 1;
pid @DIR@/nginx.pid;
error_log @DIR@/error.log;
events { worker_connections 32; }
http {
    access_log off;
    client_body_temp_path @DIR@/body;
    proxy_temp_path @DIR@/proxy;
    include @DIR@/controller-http.conf;
    include @DIR@/controller-@MODE@.conf;
    server {
        listen 127.0.0.1:@AUTH@;
        location = /oauth2/auth {
            if ($http_cookie !~ "(^|; )session=valid(;|$)") { return 401; }
            add_header X-Auth-Request-User verified-subject always;
            return 202;
        }
        location = /oauth2/callback {
            if ($arg_code != fixture) { return 400; }
            return 204;
        }
    }
}
