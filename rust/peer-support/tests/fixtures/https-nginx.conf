# Ephemeral test-only frontend with a per-fixture CSRF value and real Basic authentication.
daemon off;
worker_processes 1;
pid @DIR@/nginx.pid;
error_log @DIR@/error.log crit;
events { worker_connections 32; }
http {
    map_hash_bucket_size 256;
    access_log off;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_temp_path @DIR@/body;
    proxy_temp_path @DIR@/proxy;
    map "$request_method:$http_origin:$http_x_csrf_token:$http_content_type" $permitted {
        default 0;
        ~^(GET|HEAD|OPTIONS): 1;
        "PATCH:https://console.local:@CSRF@:application/json-patch+json" 1;
        "PUT:https://console.local:@CSRF@:application/hal+json" 1;
        "POST:https://console.local:@CSRF@:application/hal+json" 1;
        "DELETE:https://console.local:@CSRF@:" 1;
    }
    map $http_upgrade $status_upgrade {
        default "";
        ~*^websocket$ websocket;
    }
    map $status_upgrade $status_connection {
        default upgrade;
        "" "";
    }
    upstream management {
        server 127.0.0.1:@BACK@;
        keepalive 2;
    }
    server {
        listen 127.0.0.1:@FRONT@ ssl;
        ssl_certificate @PKI@/server.pem;
        ssl_certificate_key @PKI@/server.key;
        location / {
            auth_basic "test console";
            auth_basic_user_file @DIR@/users;
            if ($permitted = 0) { return 403; }
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Connection $status_connection;
            proxy_set_header Upgrade $status_upgrade;
            proxy_set_header Authorization "";
            proxy_set_header X-CSRF-Token "";
            proxy_set_header X-Forwarded-Client-Cert "";
            proxy_set_header X-HTTP-Method-Override "";
            proxy_ssl_certificate @PKI@/nginx.pem;
            proxy_ssl_certificate_key @PKI@/nginx.key;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate @PKI@/@CA@.pem;
            proxy_ssl_name @NAME@;
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass https://management;
        }
    }
}
