[package]
name = "rpt-advanced-standalone"
build = "build.rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "rpt-advanced"
path = "src/main.rs"

[dependencies]
rptadv-private-phone-host = { path = "../private-phone-host" }
crossbeam-queue = "0.3.12"
libc = "0.2"
libloading = "0.8"
rptadv-json = { path = "../json" }
rptadv-peer-support = { path = "../peer-support" }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
webpki-roots = "=0.26.11"

[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]
rptadv-control-standalone-adapter = { path = "../control-standalone-adapter" }
