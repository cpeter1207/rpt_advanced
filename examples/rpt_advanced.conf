; Shared node settings. Copy this file to the station's configuration directory.
; Choose the radio channel and station ID before enabling a node.
[general]
node_enabled = no
full_duplex = yes
; Silence qualified local in-band DTMF tone audio before command completion.
; The global value is inherited by each node and may be overridden there.
dtmf_muting = yes
; Play eligible link digits addressed to this node on its local transmitter.
; An idle queue waits 500 ms, then plays without waiting for the sender to unkey.
; Command digits, transit digits, and ordinary local RF digits are not replayed.
; Generated tones stay off links and parrot. Nodes may override these settings.
dtmf_regeneration_enabled = no
; Fixed tone length and following silence, each 1-1000 whole milliseconds.
dtmf_regeneration_duration_ms = 200
dtmf_regeneration_gap_ms = 50
; Combined peak of both tones, -60 to 0 whole dBFS, before transmitter processing.
dtmf_regeneration_level_dbfs = -12
; Delay local receive playout to remove the buffered squelch tail on unkey.
; Zero adds no delay. A rapid rekey cannot replay the previous receive burst.
squelch_delay_ms = 0
; Update RX/TX meters and receive-buffer status every 50 ms. Nodes may override this.
status_snapshot_interval_ms = 50
transmit_hang_ms = 0
; Release PTT after this keyed interval without a local-receiver or direct-link unkey, then lock
; out until the source clears and this post-timeout period expires. Each ordinary unkey restarts
; the timer even if hang time keeps PTT asserted. Set any timer to 0 to disable that limit.
transmit_timeout_ms = 180000
timeout_lockout_ms = 30000
; A receiver or individual link transmission no longer than this duration has no hang time,
; courtesy tone, or every-release announcement. A final kerchunk cancels any waiting tone.
; Other playing telemetry or due IDs may still key PTT. Set 0 to treat every transmission normally.
kerchunk_max_ms = 500
; Smoothly attenuate identifier and RF telemetry while local or linked receive is active.
; Set 0 for no attenuation. Valid values are -60 through 0 dB.
telemetry_duck_db = -20
; Courtesy playback starts after this delay and keeps PTT asserted until it ends.
; Define each courtesy source below in a named [courtesy node label] section.
courtesy_delay_ms = 250
; Local radio audio uses 48 kHz. Linked IAX peers may use lower rates.
; Incoming link access lists: comma-separated node numbers; empty means no restriction.
; Explicit denial overrides allowlist membership. Every caller still requires
; independent directory/address identity verification.
link_allow_nodes =
link_deny_nodes =
; Optional local-priority [extnodes] override. A record is authoritative and must include the
; numeric address used to verify incoming callers.
link_static_directory_file =
; Optional ASL external [extnodes] directory. Its record syntax is:
; Entry syntax: 12345=radio@host:4569/12345,192.0.2.1 (the key and final path number match).
link_directory_file =
; After the static source, choose ASL DNS, the external file, or both. `both` checks DNS first.
link_lookup_method = both
; ASL3 HTTPS node registration defaults to the official endpoint. Set this blank to disable.
; Configure
; `iax_secret` for each registered node in /etc/rpt_advanced/iax-secrets.conf.
iax_registration_url = https://register.allstarlink.org/
iax_registration_interval_s = 60
iax_local_port = 4569
; DTMF link commands start with *. A node can override their prefixes.
; *4 followed by a valid node number selects it locally. Later digits travel
; directly or through connected relays. Unkey and pauses keep it selected.
; Send # to exit; that # is not forwarded. Do not add # to select a node.
link_command_remote = 4
; Key locally, send *82, press the keys to test, then release PTT for the reply.
; Capture includes 0-9, *, #, and A-D. Only actual unkey ends the test.
; The first 127 symbols are kept; extra symbols cause an overflow notice.
; No admin unlock is needed. Set this empty to disable the test.
link_command_pad_test = 82
; Read a sensor/input or play a message by its positive dtmf_id, then unkey.
; For selector 1, the defaults are *761# and *771# respectively.
link_command_site_status = 76
link_command_message = 77
; DTMF and macro links last until the controller stops. CLI commands need Asterisk.
; A [permanent node label] link is restored from this file at start and reload.

; Shared ID defaults. No identification is configured until text is supplied.
[identifier]
interval_ms = 600000
priority = 0
first_key_only = no
; If several sets are first-key-only, one eligible set plays on each qualifying
; key-up, rotating through them. A pending set keeps its turn unless it is
; completed or satisfied by a higher-priority ID.
regardless_of_activity = no
; Hold due IDs for clear RF and pending telemetry, but no more than this long.
polite = no
polite_maximum_wait_ms = 60000
sound_file =
speech_text =
morse_text =

; Shared announcement defaults. A named [announcement node set] supplies playable media.
; Zero interval plays that set after every completed transmission; positive intervals rate-limit it.
[announcement]
interval_ms = 0
sound_file =
speech_text =
morse_text =

; Courtesy defaults apply to every named courtesy section. This section itself assigns no input.
; Media is tried in this order: sound file, speech, tone sequence, then Morse.
; A tone sequence is comma-separated segments such as 700Hz+900Hz / 75ms / -20dB,
; silence / 25ms, 1000Hz / 75ms. The final per-segment level is optional.
; Use this readable configuration syntax; no DTMF programming is required.
[courtesy]
sound_file =
speech_text =
morse_text =
tone_sequence =
level_db = -20

; Speech defaults may be overridden per node in [speech node]. Level is dBFS gain.
[speech]
voice = en_US-lessac-medium.onnx
speed_percent = 100
level_db = 0

; Morse defaults may be overridden per node in [morse node].
[morse]
frequency_hz = 800
speed_wpm = 20
; Morse tone level in dBFS.
level_db = -6

; *722 announces the local system time. The flat default below applies to every node;
; use [time node-name] to override it for one node. Valid values are 12 and 24.
[time]
format = 12

; Named templates use [template label] globally or [template node label] for one node.
; Their text accepts only the documented ${day_of_week}, ${date}, ${time}, ${greeting},
; ${link_status}, ${node}, and ${callsign} substitutions. The worst-case rendered message must
; fit 127 bytes; it is rejected rather than truncated if it could exceed that bound.
; Named macros use [macro label] or [macro node label]. Each has one controller action:
; connect creates a nonpermanent transceive link, while disconnect detaches one active direct
; peer. disconnect_all detaches every current temporary and permanent direct peer and pauses
; their retained retries; reconnect_all resumes those retries. connect and disconnect require
; target_node; disconnect_all and reconnect_all do not.
; Zero-time events use [event node label]. `at` is exactly daily HH:MM, weekly weekday HH:MM,
; or once YYYY-MM-DD HH:MM in the local timezone. An event can use a direct message or named
; template, and can also run a named macro. Its message is queued before its macro runs, but the
; macro does not wait for on-air playback. Events for disabled nodes are skipped with no catch-up.
; A rendered message with no Morse-representable character is treated as no message, so unavailable
; speech cannot key a silent transmission; its paired macro still runs.
; Do not create an empty named template, macro, or event.
; Set built-in RF message language in [general] or one node. Missing text uses en-US.

; Standalone hardware and audio-processing defaults. These are separate from
; radio_channel, which is used only by the Asterisk channel adapter.
[radio]
; Require a stable device identifier and/or USB serial by default. Set to
; automatic_lowest_alsa_card only when the host has one intended USB radio.
device_selection = exact
device_identifier =
usb_serial =
input_device_channels = 1
output_device_channels = 1
; Extra PortAudio buffering requested beyond the device's low-latency defaults.
input_extra_buffer_ms = 0
output_extra_buffer_ms = 0
; Optional hardware mixer levels, -30 to +30 dB; 0 selects the midpoint.
; Leave a setting commented out to preserve its current hardware level.
; hardware_input_gain_db = 0
; hardware_output_a_gain_db = 0
; hardware_output_b_gain_db = 0
; Mono 48 kHz FFmpeg processing graphs. anull leaves audio unchanged.
receive_graph = anull
transmit_graph = anull
; CM119 wiring layout: dudeusb, sphusb, nhrc, or custom.
cm119_profile = dudeusb
; Set yes only when the interface PTT output is electrically inverted.
cm119_ptt_inverted = no
; GPIOs start as inputs. Select out0/out1 only for connected external devices.
cm119_gpio_1_mode = in
cm119_gpio_2_mode = in
cm119_gpio_3_mode = in
cm119_gpio_4_mode = in
cm119_gpio_5_mode = in
cm119_gpio_6_mode = in
cm119_gpio_7_mode = in
cm119_gpio_8_mode = in
; Use 0 to disable the clip LED, or select GPIO 1 through 8.
cm119_clip_led_gpio = 0

; Receive source: disabled, speaker, or flat discriminator audio.
receive_audio = flat
; Receive qualification: carrier, ctcss, or dcs.
receive_signaling = carrier
; Carrier source: disabled, dsp, vox, cm119, cm119_inverted, parallel,
; or parallel_inverted. DSP is the native discriminator-noise squelch.
carrier_source = dsp
; CTCSS/DCS indication source: disabled, dsp, CM119 GPIO, or parallel input.
ctcss_source = dsp
receive_ctcss_tones_hz = 100.0
ctcss_decoder_gain_db = 0
ctcss_relaxed = yes
ctcss_override = no
dcs_receive_code = 023N
; DSP noise squelch threshold uses the 0-999 scale; hysteresis/VOX use PCM codes.
squelch_level = 500
squelch_hysteresis = 3000
noise_filter = standard
vox_threshold = 0
vox_hang_ms = 2000
receive_on_delay_ms = 0
; Physical radio capability, independent of the controller's link duplex mode.
radio_duplex_mode = half

; Transmit signaling: carrier, ctcss, or dcs.
transmit_signaling = carrier
transmit_ctcss_tones_hz = 100.0
transmit_ctcss_default_hz = 100.0
transmit_ctcss_level_dbfs = -24
; CTCSS turnoff: none, phase_shift, tone_remove, or tail_tone.
transmit_ctcss_turnoff_mode = phase_shift
transmit_ctcss_phase_shift_degrees = 120
transmit_ctcss_turnoff_duration_ms = 180
transmit_ctcss_tail_tone_hz = 55
transmit_dcs_code = 023N
transmit_dcs_level_dbfs = -24
transmit_dcs_turnoff_enabled = yes
transmit_dcs_turnoff_duration_ms = 180
; Wait after PTT before audio, blank receive while transmitting, or ignore RX
; briefly after unkeying. All values are milliseconds.
transmit_settle_ms = 500
transmit_receive_blanking_ms = 0
transmit_off_delay_ms = 0

; Each named section selects one USBRadioPlus channel without RadioPlus/.
[example]
radio_channel = example
; Select Fluent wording for this node; omitted nodes inherit [general] language.
; language = en-US
; Optional per-node snapshot cadence; omitted nodes inherit [general] (50 ms).
; status_snapshot_interval_ms = 50
; Optional station identity, up to 63 bytes, used by ${callsign} in scheduled messages.
callsign =
; This node may override the shared IAX registration URL, interval, and port.

; Override standalone device or processing settings for this node when needed.
[radio example]
; device_identifier = 3-1:1.0
; usb_serial = CM119-SERIAL
; input_extra_buffer_ms = 20
; output_extra_buffer_ms = 20
; receive_graph = highpass=f=150,lowpass=f=5000
; transmit_graph = highpass=f=150,lowpass=f=5000

; Optional node-wide ID defaults override the shared identifier section.
[identifier example]

; Per-node presentation defaults override the flat sections above.
[speech example]
; voice = /usr/lib/piper-tts/voices/en_US-amy-low.onnx
; speed_percent = 100
; level_db = 0

[morse example]
; frequency_hz = 800
; speed_wpm = 20
; level_db = -6

[time example]
; format = 24

; Per-node courtesy defaults override [courtesy]. This section itself assigns no input.
[courtesy example]
; level_db = -20

; Each playable courtesy tone has its own named section and an input assignment.
; The receiver tone plays after local receive unkeys. It is canceled if that receiver
; keys again before it starts; other source-specific tones remain queued.
[courtesy example receiver]
input = receiver
; A single 500 Hz beep. `morse_text` remains its fallback if this line is removed.
tone_sequence = 500Hz / 80ms
morse_text = R
morse_frequency_hz = 500

; The generic link tone is the fallback for any peer without a matching exact-peer tone.
[courtesy example link]
input = link
; A dual-tone beep, a pause, then a quieter single-tone beep. This demonstrates
; mono, dual-tone, silence, and a per-segment level in one readable sequence.
tone_sequence = 1000Hz+1200Hz / 75ms / -20dB, silence / 40ms, 1000Hz / 75ms / -26dB
morse_text = L
morse_frequency_hz = 1000

; A peer-specific tone can match a direct peer or a reported keyed downstream node.
; If no matching tone can play, [courtesy example link] plays. Replace these
; example node numbers with the peers you want to identify.
[courtesy example north]
input = link
remote_node = 100001
; This peer has its own two-beep source identifier; all other link sources use
; [courtesy example link].
tone_sequence = 900Hz / 60ms / -20dB, silence / 40ms, 900Hz / 60ms / -24dB
morse_text = N
morse_frequency_hz = 900

[courtesy example south]
input = link
remote_node = 100002
morse_text = S
morse_frequency_hz = 900

[courtesy example east]
input = link
remote_node = 100003
morse_text = E
morse_frequency_hz = 900

[courtesy example west]
input = link
remote_node = 100004
morse_text = W
morse_frequency_hz = 900

; Periodic conversation ID: file, then speech, then terminal Morse fallback.
; These illustrative values are commented, so this shipped example remains disabled and silent.
[identifier example conversation]
priority = 1
; A ten-minute ID constraint can use a 940-second scheduling interval plus this 60-second hold.
; interval_ms = 940000
; polite = yes
; polite_maximum_wait_ms = 60000
; sound_file = /var/lib/asterisk/sounds/local/example-id.wav
; speech_text = This is the example repeater
; morse_text = DE EXAMPLE
; speech_model = /usr/lib/piper-tts/voices/en_US-amy-low.onnx
; speech_speed_percent = 100
; speech_level_db = 0
; morse_frequency_hz = 800
; morse_speed_wpm = 20
; morse_level_db = -6

; Welcome is first-key-only after an entire interval without activity.
; Its higher priority satisfies the lower-priority conversation set as well.
[identifier example welcome]
priority = 2
first_key_only = yes
; speech_text = Welcome to the example repeater
; morse_text = DE EXAMPLE

; An every-release announcement plays after the normal hang and any due ID, before PTT releases.
; This remains disabled because its media is commented.
[announcement example release]
interval_ms = 0
; morse_text = K

; A periodic announcement may key PTT while idle. It plays a due ID first, then this media.
; This remains disabled because its media is commented.
[announcement example periodic]
interval_ms = 1800000
; speech_text = This is the example repeater
; morse_text = DE EXAMPLE

; These complete sections are commented so this shipped example schedules no telemetry or links.
; [template example net_start]
; text = ${greeting}. The ${callsign} net starts at ${time}.

; [macro example connect_news]
; action = connect
; target_node = 123456

; [macro example clear_links]
; action = disconnect_all

; [event example weekly_net]
; at = weekly Tuesday 19:00
; template = net_start
; macro = connect_news

; [event example evening_id]
; at = daily 21:30
; message = ${greeting}. This is ${callsign}.

; [event example special]
; at = once 2026-12-31 23:55
; macro = clear_links

; A configuration-owned permanent direct peer is scheduled at module start and after reload.
; Its label is referenced by replacement schedules for this same node.
; [permanent example primary]
; remote_node = 506315

; A priority group keeps every listed member connected receive-only except the
; highest-priority reachable member, which transceives. List order is priority.
; Only initial selection and complete unavailability are announced; retries,
; standby changes, and later winner handoffs are silent.
; [permanent example blind_hams]
; remote_node = 506315,506312,506310,506311,506313,506314
; group_name = The Blind Hams Network

; A one-member priority group uses the same syntax with one remote node.
; [permanent example single_member]
; remote_node = 506315
; group_name = Primary repeater

; A local-time replacement window detaches `primary` before attaching 2627.
; `days` accepts full names and inclusive ranges. Omit it for every date, or use
; `dates = 2026-12-31, 2027-01-01` instead; `days` and `dates` cannot be combined.
; Times are exact local 24-hour HH:MM values; end_time must be later on the same day.
; With a nonzero end_inactivity_ms, recent local or link receive defers restoration;
; set it to 0 for restoration at the end of the window.
; Overlapping windows form a union: every matching replacement is requested and
; its named primary is suppressed. Topology admission is the only conflict gate,
; so do not use an overlap to select one replacement route.
; [schedule example weekday_net]
; remote_node = 2627
; replace_permanent = primary
; days = Monday-Friday
; start_time = 11:00
; end_time = 12:00
; end_inactivity_ms = 300000
; Optional pre-start and pre-disconnect warnings; values are positive
; milliseconds, in the order they should be sent. No warning is enabled unless
; at least one lead and a supported warning_message_id are configured.
; Active local/link traffic skips a due warning. Inactivity warnings are
; recalculated after activity resets the disconnect deadline.
; warning_before_start_ms = 3600000,1800000,900000,600000,300000,60000
; warning_before_end_ms = 600000,300000,60000
; warning_message_id = scheduled-link-change

; Reusable messages. These examples remain commented and do not enable playback.
; [message clock]
; message_id = site-time
; arg_time = time
; dtmf_id = 1

; [message temperature]
; message_id = site-temperature
; arg_temperature = sensor:heat

; Put attention tones anywhere in content, using the courtesy segment syntax.
; [message warning]
; content = {tone_sequence} {message_macro_temperature}
; tone_sequence = 1000Hz / 200ms / -20dB

; An ID may combine words, message references and its own {media} recording.
; [identifier example composed]
; content = This is the example repeater. {message_macro_clock} {message_macro_temperature}

; A release tail follows traffic hang time. Zero delay holds PTT through playback;
; positive delay unkeys, waits, then keys for the tail. Interval zero permits every
; traffic release; a positive interval waits for a later release after that time.
; [tail example closing]
; interval_ms = 1800000
; delay_ms = 0
; content = {message_macro_clock}

; Site meters and control. Replace every device path/pin before enabling anything.
; These entries are syntax examples. Check the circuit's limits and polarity.
; [sensor example heat]
; enabled = no
; backend = hwmon
; device = /sys/class/hwmon/hwmon0
; channel = temp1_input
; unit = celsius
; precision = 1
; poll_interval_ms = 1000
; stale_after_ms = 5000
; smoothing_ms = 0
; calibration = none
; dtmf_id = 1

; Read a spare CM119 pin through the node that already owns the radio.
; [input example door]
; enabled = no
; backend = cm119
; device = example
; line = 8
; active_level = low
; debounce_ms = 50
; dtmf_id = 2
; on_active = inhibit:on
; on_inactive = inhibit:off

; A spare output may not overlap PTT, tone control, or an interlock pin.
; [output example fan_relay]
; enabled = no
; backend = gpiod
; device = /dev/gpiochip0
; line = 7
; active_level = high
; startup_state = off
; safe_state = off
; pulse_ms = 500

; [fan example cooling]
; enabled = no
; output = fan_relay
; mode = combined
; ptt_nodes = example
; run_on_ms = 120000
; temperature_sensor = heat
; on_temperature = 45
; off_temperature = 40

; Alarm messages use named message definitions. Protective actions do not wait
; for speech. A latched alarm must recover before it can be reset.
; [alarm example hot]
; enabled = no
; source = heat
; condition = above
; trip_value = 65
; clear_value = 55
; trip_delay_ms = 1000
; clear_delay_ms = 5000
; latched = yes
; on_trip = inhibit:on
; on_clear = inhibit:off
; trip_message = warning
; repeat_message = warning
; repeat_interval_ms = 60000
