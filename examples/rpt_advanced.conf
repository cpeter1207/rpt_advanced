; Shared node defaults. Copy this example to Asterisk's configuration directory
; and choose your channel and identification before enabling a node.
[general]
node_enabled = no
full_duplex = yes
transmit_hang_ms = 0
; Smoothly attenuate identifier and RF telemetry while local or linked receive is active.
; Set 0 for no attenuation. Valid values are -60 through 0 dB.
telemetry_duck_db = -20
; Courtesy playback starts after this delay and keeps PTT asserted until it ends.
; Leave all courtesy media empty to disable it.
courtesy_delay_ms = 250
receiver_courtesy_sound_file =
receiver_courtesy_speech_text =
receiver_courtesy_morse_text =
; receiver_courtesy_morse_frequency_hz = 500
; Level for receiver courtesy sound, speech, or Morse. Valid values are -60 through 0 dB.
receiver_courtesy_level_db = -20
link_courtesy_sound_file =
link_courtesy_speech_text =
link_courtesy_morse_text =
; link_courtesy_morse_frequency_hz = 1000
; Level for link courtesy sound, speech, or Morse. Valid values are -60 through 0 dB.
link_courtesy_level_db = -20
; Example Morse courtesy tones:
; receiver_courtesy_morse_text = R
; link_courtesy_morse_text = L
; Zero chooses the highest usable local signed-linear rate up to the hardware-native rate.
sample_rate_hz = 0
; Empty selects signed linear for the local radio channel; a name requests a local Asterisk codec.
; IAX links negotiate their own codec and rate, then resample at the link boundary.
codec =
; Incoming link access lists: comma-separated node numbers; empty means no restriction.
; Explicit denial overrides allowlist membership. Every caller still requires
; independent directory/address identity verification.
link_allow_nodes =
link_deny_nodes =
; Optional local-priority [extnodes] override. A record is authoritative and must include the
; numeric address used to verify incoming callers.
link_static_directory_file =
; Optional ASL external [extnodes] directory. Its record syntax is:
; Entry syntax: 12345=radio@host:4569/12345,192.0.2.1 (the key and final path number match).
link_directory_file =
; After the static source, choose ASL DNS, the external file, or both. `both` checks DNS first.
link_lookup_method = both
; The documented *-initiated DTMF link-command defaults are inherited here.
; Link state is runtime-only; permanent links do not survive an Asterisk restart.

; Shared ID defaults. No identification is configured until text is supplied.
[identifier]
interval_ms = 600000
priority = 0
first_key_only = no
regardless_of_activity = no
sound_file =
speech_text =
morse_text =

; Speech defaults may be overridden per node in [speech node]. Level is dBFS gain.
[speech]
voice = en_US-lessac-medium.onnx
speed_percent = 100
level_db = 0

; Morse defaults may be overridden per node in [morse node].
[morse]
frequency_hz = 800
speed_wpm = 20
; -6 dB is approximately the historical half-scale Morse level.
level_db = -6

; Each named section selects one USBRadioPlus channel without RadioPlus/.
[example]
radio_channel = example

; Optional node-wide ID defaults override the shared identifier section.
[identifier example]

; Per-node presentation defaults override the flat sections above.
[speech example]
; voice = /usr/lib/piper-tts/voices/en_US-amy-low.onnx
; speed_percent = 100
; level_db = 0

[morse example]
; frequency_hz = 800
; speed_wpm = 20
; level_db = -6

; Periodic conversation ID: file, then speech, then terminal Morse fallback.
; These illustrative values are commented, so this shipped example remains disabled and silent.
[identifier example conversation]
priority = 1
; sound_file = /var/lib/asterisk/sounds/local/example-id.wav
; speech_text = This is the example repeater
; morse_text = DE EXAMPLE
; speech_model = /usr/lib/piper-tts/voices/en_US-amy-low.onnx
; speech_speed_percent = 100
; speech_level_db = 0
; morse_frequency_hz = 800
; morse_speed_wpm = 20
; morse_level_db = -6

; Welcome is first-key-only after an entire interval without activity.
; Its higher priority satisfies the lower-priority conversation set as well.
[identifier example welcome]
priority = 2
first_key_only = yes
; speech_text = Welcome to the example repeater
; morse_text = DE EXAMPLE
