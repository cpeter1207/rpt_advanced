; Shared node defaults. Copy this example to Asterisk's configuration directory
; and choose your channel and identification before enabling a node.
[general]
node_enabled = no
full_duplex = yes
; Silence a local PCM frame when its in-band DTMF digit completes decoding.
; The global value is inherited by each node and may be overridden there.
dtmf_muting = yes
transmit_hang_ms = 0
; Smoothly attenuate identifier and RF telemetry while local or linked receive is active.
; Set 0 for no attenuation. Valid values are -60 through 0 dB.
telemetry_duck_db = -20
; Courtesy playback starts after this delay and keeps PTT asserted until it ends.
; Define each courtesy source below in a named [courtesy node label] section.
courtesy_delay_ms = 250
; Zero chooses the highest usable local signed-linear rate up to the hardware-native rate.
sample_rate_hz = 0
; Empty selects signed linear for the local radio channel; a name requests a local Asterisk codec.
; IAX links negotiate their own codec and rate, then resample at the link boundary.
codec =
; Incoming link access lists: comma-separated node numbers; empty means no restriction.
; Explicit denial overrides allowlist membership. Every caller still requires
; independent directory/address identity verification.
link_allow_nodes =
link_deny_nodes =
; Optional local-priority [extnodes] override. A record is authoritative and must include the
; numeric address used to verify incoming callers.
link_static_directory_file =
; Optional ASL external [extnodes] directory. Its record syntax is:
; Entry syntax: 12345=radio@host:4569/12345,192.0.2.1 (the key and final path number match).
link_directory_file =
; After the static source, choose ASL DNS, the external file, or both. `both` checks DNS first.
link_lookup_method = both
; The documented *-initiated DTMF link-command defaults are inherited here.
; Link state is runtime-only; permanent links do not survive an Asterisk restart.

; Shared ID defaults. No identification is configured until text is supplied.
[identifier]
interval_ms = 600000
priority = 0
first_key_only = no
regardless_of_activity = no
; Hold due IDs for clear RF and pending telemetry, but no more than this long.
polite = no
polite_maximum_wait_ms = 60000
sound_file =
speech_text =
morse_text =

; Shared announcement defaults. A named [announcement node set] supplies playable media.
; Zero interval plays that set after every completed transmission; positive intervals rate-limit it.
[announcement]
interval_ms = 0
sound_file =
speech_text =
morse_text =

; Courtesy defaults apply to every named courtesy section. This section itself assigns no input.
; Media is tried in this order: sound file, speech, tone sequence, then Morse.
; A tone sequence is comma-separated segments such as 700Hz+900Hz / 75ms / -20dB,
; silence / 25ms, 1000Hz / 75ms. The final per-segment level is optional.
; Use this readable configuration syntax; no DTMF programming is required.
[courtesy]
sound_file =
speech_text =
morse_text =
tone_sequence =
level_db = -20

; Speech defaults may be overridden per node in [speech node]. Level is dBFS gain.
[speech]
voice = en_US-lessac-medium.onnx
speed_percent = 100
level_db = 0

; Morse defaults may be overridden per node in [morse node].
[morse]
frequency_hz = 800
speed_wpm = 20
; -6 dB is approximately the historical half-scale Morse level.
level_db = -6

; *722 announces the local system time. The flat default below applies to every node;
; use [time node-name] to override it for one node. Valid values are 12 and 24.
[time]
format = 12

; Each named section selects one USBRadioPlus channel without RadioPlus/.
[example]
radio_channel = example

; Optional node-wide ID defaults override the shared identifier section.
[identifier example]

; Per-node presentation defaults override the flat sections above.
[speech example]
; voice = /usr/lib/piper-tts/voices/en_US-amy-low.onnx
; speed_percent = 100
; level_db = 0

[morse example]
; frequency_hz = 800
; speed_wpm = 20
; level_db = -6

[time example]
; format = 24

; Per-node courtesy defaults override [courtesy]. This section itself assigns no input.
[courtesy example]
; level_db = -20

; Each playable courtesy tone has its own named section and an input assignment.
; The receiver tone plays after local receive unkeys. It is canceled if that receiver
; keys again before it starts; other source-specific tones remain queued.
[courtesy example receiver]
input = receiver
; A single 500 Hz beep. `morse_text` remains its fallback if this line is removed.
tone_sequence = 500Hz / 80ms
morse_text = R
morse_frequency_hz = 500

; The generic link tone is the fallback for any peer without a matching permanent-peer tone.
[courtesy example link]
input = link
; A dual-tone beep, a pause, then a quieter single-tone beep. This demonstrates
; mono, dual-tone, silence, and a per-segment level in one readable sequence.
tone_sequence = 1000Hz+1200Hz / 75ms / -20dB, silence / 40ms, 1000Hz / 75ms / -26dB
morse_text = L
morse_frequency_hz = 1000

; Permanent direct-peer tones match the exact remote_node. Replace these illustrative node
; numbers with the permanently connected nodes that identify north, south, east, and west.
[courtesy example north]
input = link
remote_node = 100001
; This permanent peer has its own two-beep source identifier; all other link peers
; use [courtesy example link].
tone_sequence = 900Hz / 60ms / -20dB, silence / 40ms, 900Hz / 60ms / -24dB
morse_text = N
morse_frequency_hz = 900

[courtesy example south]
input = link
remote_node = 100002
morse_text = S
morse_frequency_hz = 900

[courtesy example east]
input = link
remote_node = 100003
morse_text = E
morse_frequency_hz = 900

[courtesy example west]
input = link
remote_node = 100004
morse_text = W
morse_frequency_hz = 900

; Periodic conversation ID: file, then speech, then terminal Morse fallback.
; These illustrative values are commented, so this shipped example remains disabled and silent.
[identifier example conversation]
priority = 1
; A ten-minute ID constraint can use a 940-second scheduling interval plus this 60-second hold.
; interval_ms = 940000
; polite = yes
; polite_maximum_wait_ms = 60000
; sound_file = /var/lib/asterisk/sounds/local/example-id.wav
; speech_text = This is the example repeater
; morse_text = DE EXAMPLE
; speech_model = /usr/lib/piper-tts/voices/en_US-amy-low.onnx
; speech_speed_percent = 100
; speech_level_db = 0
; morse_frequency_hz = 800
; morse_speed_wpm = 20
; morse_level_db = -6

; Welcome is first-key-only after an entire interval without activity.
; Its higher priority satisfies the lower-priority conversation set as well.
[identifier example welcome]
priority = 2
first_key_only = yes
; speech_text = Welcome to the example repeater
; morse_text = DE EXAMPLE

; An every-release announcement plays after the normal hang and any due ID, before PTT releases.
; This remains disabled because its media is commented.
[announcement example release]
interval_ms = 0
; morse_text = K

; A periodic announcement may key PTT while idle. It plays a due ID first, then this media.
; This remains disabled because its media is commented.
[announcement example periodic]
interval_ms = 1800000
; speech_text = This is the example repeater
; morse_text = DE EXAMPLE
