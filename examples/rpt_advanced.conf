; Shared node defaults. Copy this example to Asterisk's configuration directory
; and choose your channel and identification before enabling a node.
[general]
node_enabled = no
full_duplex = yes
transmit_hang_ms = 0
; Zero chooses the highest supported rate up to the hardware-native rate.
sample_rate_hz = 0
; Empty selects signed linear; a name requests an installed Asterisk codec.
codec =
; Incoming link access lists: comma-separated node numbers; empty means no restriction.
; Explicit denial overrides allowlist membership and same-server exemptions.
; These settings are applied to incoming AllStarLink admission.
link_allow_nodes =
link_deny_nodes =
; Optional [extnodes] directory; empty uses the AllStarLink DNS directory.
; Entry syntax: 12345=radio@host:4569/12345,192.0.2.1
link_directory_file =

; Shared ID defaults. No identification is configured until text is supplied.
[identifier]
interval_ms = 600000
priority = 0
first_key_only = no
regardless_of_activity = no
sound_file =
speech_text =
morse_text =

; Speech defaults may be overridden per node in [speech node]. Level is dBFS gain.
[speech]
voice = en_US-lessac-medium.onnx
speed_percent = 100
level_db = 0

; Morse defaults may be overridden per node in [morse node].
[morse]
frequency_hz = 800
speed_wpm = 20
; -6 dB is approximately the historical half-scale Morse level.
level_db = -6

; Each named section selects one USBRadioPlus channel without RadioPlus/.
[example]
radio_channel = example

; Optional node-wide ID defaults override the shared identifier section.
[identifier example]

; Per-node presentation defaults override the flat sections above.
[speech example]
; voice = /usr/lib/piper-tts/voices/en_US-amy-low.onnx
; speed_percent = 100
; level_db = 0

[morse example]
; frequency_hz = 800
; speed_wpm = 20
; level_db = -6

; Periodic conversation ID: file, then speech, then terminal Morse fallback.
[identifier example conversation]
priority = 1
; speech_level_db = 0
; morse_level_db = -6

; Welcome is first-key-only after an entire interval without activity.
; Its higher priority satisfies the lower-priority conversation set as well.
[identifier example welcome]
priority = 2
first_key_only = yes
